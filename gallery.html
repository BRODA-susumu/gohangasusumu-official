<!doctype html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アヒルギャラリー｜ご飯がすすむ 公式サイト</title>
<meta name="description" content="DAISOのTCG（蟲神器・イジンデン・千怪戦戯）を中心に活動するチャンネル「ご飯がすすむ」の公式サイト。動画・実績・お知らせ・アヒルギャラリー。">

<meta property="og:title" content="アヒルギャラリー｜ご飯がすすむ 公式サイト">
<meta property="og:description" content="ファンのみなさんが描いてくださった「ご飯がすすむ」のファンアート集。">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&amp;family=Zen+Maru+Gothic:wght@500;700&amp;display=swap">
<style>
  :root {
    --bg: #FFF8EE;
    --bg2: #FFFFFF;
    --ink: #23201A;
    --sub: #6B6558;
    --line: #23201A;
    --card: #FFFFFF;
    --card-soft: #FFF8EE;
    --thumb: #E4DCCB;
    --accent: #E5322D;
    --accent-ink: #FFFFFF;
    --yellow: #F2A20C;
    --circle: #FBE8C8;
    --footer-bg: #23201A;
    --footer-ink: #FFF8EE;
    --footer-sub: #B8B2A2;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.7;
  }
  h1, h2, h3 { font-family: 'M PLUS Rounded 1c', 'Zen Maru Gothic', sans-serif; }
  a { color: inherit; text-decoration: none; }
  img, svg { max-width: 100%; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 clamp(22px, 5vw, 32px); box-sizing: border-box; }
  .duck-icon { border-radius: 50%; border: 2px solid var(--line); object-fit: cover; background: var(--yellow); }

  /* ---------- header ---------- */
  header {
    position: sticky; top: 0; z-index: 50;
    background: var(--bg);
    border-bottom: 2px solid var(--line);
  }
  .head-in { display: flex; align-items: center; gap: 12px; height: 66px; }
  .brand { display: flex; align-items: center; gap: 10px; font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 800; font-size: 20px; }
  .brand img { width: 40px; height: 40px; flex-shrink: 0; }
  nav.gnav { margin-left: auto; display: flex; align-items: center; gap: 24px; font-weight: 700; font-size: 15px; }
  nav.gnav a:hover { color: var(--accent); }
  nav.gnav a[aria-current="page"] { color: var(--accent); }
  .yt-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--accent); color: var(--accent-ink) !important;
    padding: 9px 18px; border-radius: 999px; font-weight: 800; font-size: 14px;
  }
  .menu-btn {
    margin-left: auto; display: none;
    background: var(--bg); border: 2px solid var(--line); border-radius: 10px;
    width: 46px; height: 46px; cursor: pointer; color: var(--ink);
    align-items: center; justify-content: center;
  }
  @media (max-width: 860px) {
    .menu-btn { display: inline-flex; }
    nav.gnav {
      display: none;
      position: absolute; left: 0; right: 0; top: 66px;
      background: var(--bg); border-bottom: 2px solid var(--line);
      flex-direction: column; align-items: stretch; gap: 0; padding: 8px 20px 16px;
    }
    nav.gnav.open { display: flex; }
    nav.gnav a { padding: 12px 4px; border-bottom: 1px dashed var(--sub); }
    nav.gnav a.yt-btn { border-bottom: none; margin-top: 12px; justify-content: center; }
  }

  /* ---------- hero ---------- */
  .hero { padding: 56px 0; }
  .hero-in { display: flex; align-items: center; gap: 48px; }
  .hero-txt { flex: 1 1 380px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  .badge {
    align-self: flex-start;
    background: var(--yellow); color: #23201A;
    font-weight: 700; font-size: 13px;
    padding: 6px 16px; border-radius: 999px; border: 2px solid var(--line);
  }
  .hero h1 { margin: 0; font-size: clamp(38px, 7vw, 60px); font-weight: 800; line-height: 1.15; }
  .hero p { margin: 0; font-size: 16px; color: var(--sub); max-width: 560px; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 4px; }
  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    font-weight: 800; font-size: 15px;
    padding: 13px 26px; border-radius: 12px;
    border: 2px solid var(--line);
    box-shadow: 4px 4px 0 var(--line);
    transition: transform .1s;
  }
  .btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--line); }
  .btn-red { background: var(--accent); color: var(--accent-ink); }
  .btn-white { background: var(--card); color: var(--ink); }
  .hero-duck {
    flex: 0 0 auto;
    width: min(300px, 70vw); aspect-ratio: 1;
    border-radius: 50%;
    background: var(--circle);
    border: 3px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .hero-duck img { width: 100%; height: 100%; object-fit: cover; }
  @media (max-width: 860px) {
    .hero { padding: 40px 0; }
    .hero-in { flex-direction: column-reverse; text-align: center; }
    .hero-txt { align-items: center; }
    .hero p { font-size: 15px; }
    .btn-row { justify-content: center; }
  }

  /* ---------- 開閉式セクション ---------- */
  details.band { border-top: 2px solid var(--line); }
  .band-white { background: var(--bg2); }
  details.band > summary {
    list-style: none; cursor: pointer;
    padding: 26px 0;
  }
  details.band > summary::-webkit-details-marker { display: none; }
  details.band > summary:hover h2 { color: var(--accent); }
  .sec-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .sec-bar { width: 10px; height: 32px; background: var(--accent); border-radius: 4px; flex-shrink: 0; }
  .sec-head h2 { margin: 0; font-size: clamp(22px, 4.5vw, 30px); font-weight: 800; }
  .sec-note { font-size: 13px; color: var(--sub); }
  .chev {
    margin-left: auto; flex-shrink: 0;
    width: 38px; height: 38px; border-radius: 50%;
    border: 2px solid var(--line); background: var(--card);
    display: flex; align-items: center; justify-content: center;
  }
  .chev svg { transition: transform .2s; }
  details[open] > summary .chev svg { transform: rotate(180deg); }
  .open-hint { margin-left: auto; margin-right: 12px; font-size: 12px; color: var(--sub); }
  details[open] > summary .open-hint { display: none; }
  @media (max-width: 640px) { .open-hint { display: none; } }
  .sec-body { padding: 4px 0 52px; }

  .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 22px; }

  /* video cards */
  .v-card {
    background: var(--card-soft); border: 2px solid var(--line); border-radius: 16px;
    overflow: hidden; display: flex; flex-direction: column;
    transition: transform .12s;
  }
  .band-white .v-card { background: var(--card-soft); }
  a.v-card:hover { transform: translateY(-4px); }
  .v-thumb {
    aspect-ratio: 16 / 9; background: var(--thumb);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  }
  .v-body { padding: 16px; display: flex; flex-direction: column; gap: 6px; }
  .v-title { font-weight: 700; font-size: 15px; }
  .v-meta { font-size: 12px; color: var(--sub); }
  .chip-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; align-items: center; }
  .chip {
    background: var(--card-soft); border: 2px solid var(--line); border-radius: 999px;
    padding: 8px 18px; font-size: 13px; font-weight: 700;
  }

  /* timeline */
  .timeline { list-style: none; margin: 0; padding: 0; border-left: 3px solid var(--line); }
  .timeline li { position: relative; padding: 0 0 22px 26px; }
  .timeline li::before {
    content: ""; position: absolute; left: -9px; top: 7px;
    width: 15px; height: 15px; border-radius: 50%;
    background: var(--accent); border: 3px solid var(--bg);
  }
  .band-white .timeline li::before { border-color: var(--bg2); }
  .timeline li.tl-y::before { display: none; }
  .tl-date { font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 800; font-size: 14px; color: var(--accent); }
  .tl-body { font-size: 15px; font-weight: 700; }
  .tl-sub { font-size: 13px; color: var(--sub); font-weight: 500; }
  .tl-year {
    display: inline-block; margin: 10px 0 4px -26px;
    background: var(--line); color: var(--bg);
    font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 800; font-size: 14px;
    padding: 4px 16px; border-radius: 999px;
  }

  /* news */
  .news-item {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    background: var(--card-soft); border: 2px solid var(--line); border-radius: 16px;
    padding: 18px 22px; margin-bottom: 14px;
  }
  .news-tag {
    background: var(--accent); color: var(--accent-ink);
    font-weight: 800; font-size: 12px; padding: 6px 14px; border-radius: 8px; flex-shrink: 0;
  }
  .news-title { font-weight: 800; font-size: 16px; }
  .news-when { display: block; color: var(--accent); font-size: 15px; margin-top: 2px; }
  .news-date { margin-left: auto; font-size: 13px; color: var(--sub); }
  @media (max-width: 640px) { .news-date { margin-left: 0; width: 100%; } }

  /* X section */
  .x-wrap { display: flex; gap: 36px; align-items: stretch; }
  .x-left { flex: 1 1 320px; display: flex; flex-direction: column; gap: 16px; justify-content: center; min-width: 0; }
  .x-right { flex: 1 1 380px; min-width: 0; }
  .x-box {
    background: var(--card); border: 2px dashed var(--line); border-radius: 16px;
    padding: 20px; display: flex; flex-direction: column; gap: 14px; height: 100%;
  }
  .x-post { display: flex; gap: 12px; background: var(--card-soft); border-radius: 12px; padding: 16px; }
  .x-ava { width: 44px; height: 44px; flex-shrink: 0; }
  .x-lines { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .x-line { height: 12px; border-radius: 6px; background: var(--thumb); }
  @media (max-width: 860px) { .x-wrap { flex-direction: column; } }

  /* gallery */
  .g-grid { columns: 3 240px; column-gap: 20px; }
  .g-item {
    display: block; width: 100%; padding: 0; margin: 0 0 20px; cursor: zoom-in;
    background: var(--card); border: 2px solid var(--line); border-radius: 16px;
    overflow: hidden; break-inside: avoid;
  }
  .g-item img { display: block; width: 100%; height: auto; }
  #lightbox {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(20, 17, 12, 0.85);
    display: flex; align-items: center; justify-content: center;
    padding: 24px; cursor: zoom-out;
  }
  #lightbox img { max-width: 100%; max-height: 100%; border-radius: 12px; background: #FFFFFF; }

  /* footer */
  footer { background: var(--footer-bg); color: var(--footer-ink); border-top: 2px solid var(--line); }
  .foot-in { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; padding: 32px 0; }
  .foot-brand { display: flex; align-items: center; gap: 10px; font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 800; font-size: 17px; }
  .foot-brand img { width: 34px; height: 34px; border-color: var(--footer-ink); }
  .foot-links { display: flex; gap: 22px; font-size: 14px; margin-left: auto; flex-wrap: wrap; }
  .foot-links a:hover { color: var(--accent); }
  .foot-copy { width: 100%; font-size: 12px; color: var(--footer-sub); }
  @media (max-width: 640px) {
    .foot-in { gap: 14px; padding: 26px 0; }
    .foot-links { margin-left: 0; width: 100%; gap: 18px; }
  }



  /* news cards (thumbnail + auto-expire) */
  .news-list { display: flex; flex-direction: column; gap: 16px; }
  .news-card {
    display: flex; gap: 0; background: var(--card-soft);
    border: 2px solid var(--line); border-radius: 16px; overflow: hidden;
    transition: transform .12s;
  }
  .news-card:hover { transform: translateY(-3px); }
  .news-thumb {
    flex: 0 0 220px; aspect-ratio: 16 / 9; background: var(--thumb);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .news-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .news-info { flex: 1; display: flex; flex-direction: column; gap: 6px; padding: 16px 20px; min-width: 0; }
  .news-info .news-tag { align-self: flex-start; }
  .news-info .news-title { font-weight: 800; font-size: 17px; line-height: 1.4; }
  .news-info .news-when { color: var(--accent); font-size: 15px; font-weight: 700; }
  .news-cta { margin-top: auto; font-size: 14px; font-weight: 700; color: var(--sub); }
  .news-empty { color: var(--sub); font-size: 15px; }
  @media (max-width: 640px) {
    .news-card { flex-direction: column; }
    .news-thumb { flex-basis: auto; width: 100%; }
  }

  /* latest video */
  .latest-video { margin-bottom: 30px; }
  .latest-video h3 { margin: 0 0 12px; font-size: 19px; }
  .lv-frame {
    max-width: 760px; aspect-ratio: 16 / 9;
    border: 2px solid var(--line); border-radius: 16px; overflow: hidden;
    background: var(--thumb); box-shadow: 4px 4px 0 var(--line);
  }
  .lv-frame iframe { width: 100%; height: 100%; border: 0; display: block; }
  .x-embed { min-height: 120px; }
  .x-embed .twitter-tweet { margin: 0 auto !important; }
  [hidden] { display: none !important; }
  .page-head { padding: 48px 0 0; }
  .back-link { font-weight: 700; font-size: 14px; }
  .back-link:hover { color: var(--accent); }

  .g-cell{ break-inside:avoid; margin:0 0 20px; }
  .g-cell .g-item{ margin:0; }
  .g-cap{ font-size:12px; color:var(--sub); padding:6px 4px 0; line-height:1.5; }
  .g-cap a{ color:var(--accent); text-decoration:none; font-weight:700; }
</style>
</head>

        btn.addEventListener('click', function () { lbImg.src = it.img; lb.hidden = false; });
        cell.appendChild(btn);
        if (it.author) {
          var cap = document.createElement('div'); cap.className = 'g-cap';
          var nm = document.createElement('span'); nm.textContent = it.author; cap.appendChild(nm);
          if (it.url) { var a = document.createElement('a'); a.href = it.url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = ' ↗'; cap.appendChild(a); }
          cell.appendChild(cap);
        }
        grid.appendChild(cell);
      });
    })
    .catch(function () { grid.innerHTML = '<p class="sec-note">ファンアートを読み込めませんでした。</p>'; });
})();
</script>
</body>
</html>
